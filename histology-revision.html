add('basics','Basics: Cells, Tissues, Organs',[
['Histology',L(['Greek <b>histos</b> = tissue, <b>logos</b> = study; better described as <b>Microscopic Anatomy</b> (cells, tissues, organs, systems)','Aims: study microscopic structure, correlate structure to function, understand pathology of disease']),
'Hierarchy',F(['Cell','Tissue','Organ','System'])+L(['<b>Cell</b>: functional and structural unit of the body; size 4–200 µm, so needs a microscope; <b>cell therapy</b>','<b>4 tissues</b>: connective, epithelial, muscle, nervous','<b>Organ</b>: several tissues performing a special function (kidney, liver, lung)','<b>System</b>: organs organized for complex functions (digestive, respiratory)'])],
['Interpreting slides',L(['Tube sections: longitudinal, tangential, oblique, transverse','Round object (egg): longitudinal, tangential, transverse planes'])]]);
add('tech','Microtechniques',[
['Types','<p>Techniques used to prepare sections from organs.</p>'+L(['<b>Paraffin</b> — most commonly used','<b>Celloidin</b> — most perfect','<b>Freezing</b> — most rapid','<b>Special</b>: tissue culture, radioautography, cell fractionation'])+'<p><b>Specimens</b>: biopsies (experimental, surgical), autopsy tissue, smears (blood, urine, bone marrow), spreads (areolar connective tissue).</p>'],
['Paraffin technique: 3 phases','<p>I. Tissue processing (biopsy → paraffin block) · II. Sectioning · III. Staining</p>'+F(['Obtain specimen','Fixation (formalin)','Washing (tap water)','Dehydration (ascending alcohol)','Clearing (xylene)','Impregnation (soft paraffin)','Embedding (hard paraffin)','Sectioning (microtome)','Mounting','H&E stain'])],
['Step details',L(['<b>Fixation</b>: ASAP to prevent <b>autolysis</b>; formalin preserves fine structure, inhibits lysosomal hydrolytic enzymes, prevents putrefaction (bacteria), hardens by protein coagulation, mordanting effect (↑ stain affinity)','<b>Dehydration</b>: wet tissue can’t be infiltrated with paraffin; remove water with <b>gradually ascending</b> alcohol 70%→95%→100%','<b>Clearing</b>: removes alcohol with a substance miscible with paraffin; commonest = <b>xylene</b>','<b>Embedding</b>: infiltrate with molten paraffin (52–60 °C), left to harden','<b>Sectioning</b>: tissue microtome, 4–5 µm; sections float on <b>warm water bath</b> to remove wrinkles, picked up on glass slide','<b>Staining</b> (aqueous): de-paraffinize in oven, xylol, <b>descending</b> alcohol (100→50%), water — a reversal of dehydration. Unstained sections have uniform optical density; tissue parts show selective stain affinity'])],
['Paraffin: pros &amp; cons',T(['Advantages','Disadvantages'],[['Short preparation time','Fixative dissolves fat'],['Serial sections','Fixatives/heat may alter structure'],['Very thin, easily stained','Not for lipids (dissolved by xylol)'],['','Not for enzyme activity']])],
['Freezing technique (cryostat)',L(['Fresh tissue, rapid freezing with <b>liquid nitrogen</b> hardens sample','Section with freezing microtome in <b>cryostat</b> within minutes','Rapid diagnosis guiding <b>intra-operative</b> management, usually oncologic surgery','+ Rapid; suitable for <b>lipids and enzymes</b>; − thick sections (&gt;10 µm), serial sections hard, not easy to stain'])],
['LM vs EM preparation',T(['','Light','Electron'],[['Specimen','1 cm³','1 mm³'],['Fixation','10% formalin','2.5% glutaraldehyde + 1% osmium tetroxide'],['Dehydration','Ascending ethyl alcohol','Same'],['Clearing','Xylol/benzene','Propylene oxide'],['Embedding','Paraffin/celloidin','Epoxy resin'],['Cutting','Microtome, steel knife, 7–10 µm','Ultramicrotome, glass/diamond knife, ultrathin'],['Mounting','Glass slide','Copper grids'],['Stain','H&E','Heavy metals'],['Resolution','0.2 µm','0.2 nm']])],
['Tissue culture (nice to know)',L(['Growth of <b>living cells</b> outside the body (in vitro) in specific growth medium','Uses: cell growth/differentiation/cancer research, drug-virus-radiation effects, aging, vaccines (polio, rabies, chickenpox), cytogenetics &amp; karyotypes'])]]);
add('stain','Stains',[
['Principle','<p>Stains are reagents that <b>enhance contrast</b> and highlight organelles, muscle fibers, connective tissue and chemical components.</p>'],

['Peroxisomes',L(['Spherical, lysosome-like but contain <b>oxidative enzymes + catalase</b>; proteins made on <b>free</b> ribosomes','Oxidize substrates producing H₂O₂, then catalase eliminates it; lipid metabolism (bile acids, cholesterol); myelin sheath formation'])],
